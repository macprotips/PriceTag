# sm2fix settings. Environment variables SM2FIX_MODE, SM2FIX_HASHES,
# SM2FIX_LOG_SHADERS and SM2FIX_REAL_D3D12 override these.

# hash = barrier only after the shader(s) listed in "hashes" (default, near-zero cost)
# all  = barrier after EVERY compute dispatch (diagnostic: slower, but catches the
#        bug even if a game update changed the shader's hash)
# off  = do nothing except log
mode = hash

# Compute shader hash(es), comma separated, hex. 324071d329f05ccc is the one
# vkd3d-proton forces a barrier on for Spider-Man2.exe.
hashes = 324071d329f05ccc

# 1 = write every compute shader hash the game creates to sm2fix.log
log_shaders = 0

# Hide GPU features from the game so it takes a different code path
# (comma separated): sm65, no_int64, no_fp16, uma, no_rt
spoof =

# 1 = save every compute shader to sm2fix-dumps\ for offline analysis
dump_compute = 0

# 1 = save every vertex/mesh shader to sm2fix-dumps\
dump_graphics = 0

# Samplers using MIN/MAX reduction (hardware-supported only on M5-class GPUs):
# keep (just count them), linear (drop the reduction), point (point-sample instead)
minmax = keep

# 1 = count dispatches per compute shader (logs a summary every 20 s and at exit)
profile = 0

# Tell the game it has at most this many CPU cores (0 = don't change)
cpu_count = 0

# 1 = hook the game's skin-job launcher (this build only) and log why skinning is skipped
probe_skin = 0

# Raise RenderBudgets.ModelSkinGroupMax (size of the game's SkinningSB buffer, the cap
# on CS_ModelSkinning work per frame) to at least this many entries. 0 = don't change.
skin_budget = 0

# 1 = catch (with a one-shot memory guard) the game code that writes characters' bone
#     matrices, and log it with its call chain (needs probe_skin)
trap_writer = 0

# Save the inputs/outputs of this many dispatches of each Ziva RT GPU shader to sm2fix-capture\
# (gpu-test/replay.exe re-runs them on another driver and compares). 0 = off.
capture = 0
# ...starting this long after the first Ziva dispatch
capture_after_ms = 60000
# 1 = capture every compute shader the game dispatches (once each), not only Ziva's
capture_all = 0
# limits: captures, total MB, MB per buffer view, MB per capture
capture_max = 600
capture_budget_mb = 600
capture_view_mb = 32
capture_total_mb = 96

# Which CPU code Ziva RT (the face and cloth deformer) runs: auto (what the game picks from
# CPUID), reference (plain C++), sse41 or avx2. The CPU features the game sees are always logged.
ziva_cpu = auto

# 1 = make every character always evaluate its animation: finds the game's animation config
#     objects in memory and turns off distance/visibility culling and "auto freeze skinning"
force_anim = 0

# THE FIX for M1-M4: 1 = the game's huge (2 GB) vertex/morph pool views are made raw
#     views and its skinning + morph shaders are swapped for sm2fix-pool-<hash>.dxil
#     (same shaders reading the pool raw; the app builds them from the game's own exe). D3DMetal on M1-M4 returns 0 for typed buffer
#     reads past element 2^28 (268,435,456), so characters stored high in the pool stayed
#     in their bind pose (T-pose).
pool_fix = 0

# 1 = replace the game's skinning shader (CS_ModelSkinning) with sm2fix-skinning.dxil from
#     this folder: the same shader with its runtime-indexed local arrays rewritten as selects
replace_skinning = 0

# Diagnostic: 1 = drop the skinning shader's dispatches, to see whether its output
# is what ends up on screen (characters may vanish or break; that's expected)
skip_skinning = 0

# 1 = answer GPU timestamp queries in the shim with real time (D3DMetal reports 60 Hz
#     and all-zero timestamps on M1-M4)
fake_timestamps = 0

# 1 = log GPU queries (timestamps, occlusion) and the values the game reads back
trace_queries = 0

# Sleep this many milliseconds in every pipeline creation, to imitate the slow
# first boot after a settings change (0 = off)
pso_delay_ms = 0

# Leave empty to load C:\windows\system32\d3d12.dll (the translation layer's).
real_d3d12 =
