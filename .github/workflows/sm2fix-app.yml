name: sm2fix-app

on:
  push:
    paths: ['spiderman2-tpose-fix/**', '.github/workflows/sm2fix-app.yml']
  workflow_dispatch:

permissions:
  contents: write   # commits the rendered screenshots back to the branch

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 180
    defaults:
      run:
        working-directory: spiderman2-tpose-fix/app
    steps:
      - uses: actions/checkout@v4

      # Microsoft's shader tools, built once per pinned DXC commit and cached.
      - name: Restore DXC tools
        id: dxc-cache
        uses: actions/cache/restore@v4
        with:
          path: spiderman2-tpose-fix/app/.dxc
          key: dxc-macos-arm64-${{ hashFiles('spiderman2-tpose-fix/app/build-dxc.sh') }}

      - name: Build DXC tools
        if: steps.dxc-cache.outputs.cache-hit != 'true'
        run: |
          brew install ninja >/dev/null || true
          ./build-dxc.sh

      - name: Save DXC tools
        if: steps.dxc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: spiderman2-tpose-fix/app/.dxc
          key: dxc-macos-arm64-${{ hashFiles('spiderman2-tpose-fix/app/build-dxc.sh') }}

      - name: Test
        run: swift test

      - name: Build app
        run: VERSION=1.0.${{ github.run_number }} BUILD_NUMBER=${{ github.run_number }} UNIVERSAL=1 ./build-app.sh

      - name: Smoke test the built app
        run: |
          APP="build/Spider-Man 2 T-Pose Fix.app"
          "$APP/Contents/MacOS/SM2Fix" --selftest
          lipo -archs "$APP/Contents/MacOS/SM2Fix"
          codesign -dv "$APP" 2>&1 | head -5
          # unzip what users download and check it again
          mkdir -p /tmp/unzipped && ditto -x -k build/Spider-Man-2-T-Pose-Fix.zip /tmp/unzipped
          "/tmp/unzipped/Spider-Man 2 T-Pose Fix.app/Contents/MacOS/SM2Fix" --selftest

      - name: Native Metal texture-buffer check
        continue-on-error: true   # the runner's GPU may be virtual
        run: |
          swiftc -O ../vendor-report/repro/metal_texbuf_test.swift -o /tmp/metal_texbuf_test
          /tmp/metal_texbuf_test

      - name: Render screenshots
        run: |
          rm -rf screenshots
          "build/Spider-Man 2 T-Pose Fix.app/Contents/MacOS/SM2Fix" --snapshots screenshots

      - name: Commit screenshots
        if: github.ref == 'refs/heads/claude/elegant-dijkstra-9yhhvx'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots
          if git diff --cached --quiet; then echo "screenshots unchanged"; exit 0; fi
          git commit -q -m "sm2fix app: update screenshots [skip ci]"
          for i in 1 2 3; do
            git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: Spider-Man-2-T-Pose-Fix
          path: spiderman2-tpose-fix/app/build/Spider-Man-2-T-Pose-Fix.zip
